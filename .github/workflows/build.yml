name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Build and test
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: List APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-scheduler-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
